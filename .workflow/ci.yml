# Gitee Go 流水线：CI（后端 + 前端）
#
# 为什么用 execute@docker 而不是内置的 golang/node 插件：
#   内置插件版本太旧（Golang 最高 1.16 左右、Node 最高 15），
#   而本项目 go.mod 要求 go 1.26.0、前端是 Node 22。
#   这里直接用官方镜像，版本和 Dockerfile 保持一致。
#
# 镜像走 DaoCloud 的 Docker Hub 镜像站：Gitee Go 构建机直连 Docker Hub
# 会 Back-off pulling image，换成国内镜像站即可。
#
# 前置条件（Gitee Go → 流水线 → 通用变量）：
#   GITEE_TOKEN = Gitee 私人令牌（projects 权限），用于克隆两个私有子模块镜像：
#     gitee.com/yr007/danmu-ku-web-server
#     gitee.com/yr007/danmu-ku-web-web
#   子模块源码在 GitHub，但 Gitee 构建机访问 github.com 不稳定，
#   所以 CI 从 Gitee 镜像拉取（镜像由 scripts/push-to-github.sh 同步）。
#   未配置 GITEE_TOKEN 时脚本会直接报错退出。
version: "1.0"
name: ci
displayName: CI（测试 + 构建）

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
  pr:
    branches:
      include:
        - main

stages:
  - name: backend
    displayName: 后端
    strategy: naturally
    trigger: auto
    steps:
      - step: execute@docker
        name: backend_ci
        displayName: Go 构建 / vet / 测试
        certificate: ''
        image: docker.m.daocloud.io/library/golang:1.26-alpine
        command:
          - set -eu
          - sed -i 's#dl-cdn.alpinelinux.org#mirrors.tuna.tsinghua.edu.cn#g' /etc/apk/repositories
          - apk add --no-cache git openssh-client
          - |
            if [ ! -f DanmuKuWeb-Server/go.mod ]; then
              echo ">> 子模块未检出，开始初始化"
              if [ -z "${GITEE_TOKEN:-}" ]; then
                echo "ERROR: 未配置 GITEE_TOKEN，无法拉取 Gitee 私有子模块镜像。" >&2
                echo "请在 Gitee Go → 流水线 → 通用变量中添加 GITEE_TOKEN（projects 权限的 Gitee 私人令牌）。" >&2
                exit 1
              fi
              git config --global url."https://yr007:${GITEE_TOKEN}@gitee.com/yr007/danmu-ku-web-server.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Server.git"
              git config --global url."https://yr007:${GITEE_TOKEN}@gitee.com/yr007/danmu-ku-web-web.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Web.git"
              git submodule update --init --recursive
            fi
          - cd DanmuKuWeb-Server
          - export GOFLAGS=-mod=mod
          - export CGO_ENABLED=0
          - export GOPROXY=https://goproxy.cn,direct
          - go mod download
          - go build ./...
          - go vet ./...
          - go test -v -coverprofile=cover.out ./...

  - name: frontend
    displayName: 前端
    strategy: naturally
    trigger: auto
    steps:
      - step: execute@docker
        name: frontend_ci
        displayName: 依赖安装 / 类型检查 / 构建
        certificate: ''
        image: docker.m.daocloud.io/library/node:22-alpine
        command:
          - set -eu
          - sed -i 's#dl-cdn.alpinelinux.org#mirrors.tuna.tsinghua.edu.cn#g' /etc/apk/repositories
          - apk add --no-cache git openssh-client
          - |
            if [ ! -f DanmuKuWeb-Web/package.json ]; then
              echo ">> 子模块未检出，开始初始化"
              if [ -z "${GITEE_TOKEN:-}" ]; then
                echo "ERROR: 未配置 GITEE_TOKEN，无法拉取 Gitee 私有子模块镜像。" >&2
                echo "请在 Gitee Go → 流水线 → 通用变量中添加 GITEE_TOKEN（projects 权限的 Gitee 私人令牌）。" >&2
                exit 1
              fi
              git config --global url."https://yr007:${GITEE_TOKEN}@gitee.com/yr007/danmu-ku-web-server.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Server.git"
              git config --global url."https://yr007:${GITEE_TOKEN}@gitee.com/yr007/danmu-ku-web-web.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Web.git"
              git submodule update --init --recursive
            fi
          - cd DanmuKuWeb-Web
          - npm ci --no-audit --no-fund
          - npm run type-check
          - npm run build

# 关联 Gitee Go「通用变量」里的 GITEE_TOKEN，构建时注入为同名环境变量。
# 变量值保存在「流水线 → 通用变量」中，不写进仓库。
ref_variable:
  - GITEE_TOKEN
