# Gitee Go 流水线：CI（后端 + 前端）
#
# 为什么用 execute@docker 而不是内置的 golang/node 插件：
#   内置插件版本太旧（Golang 最高 1.16 左右、Node 最高 15），
#   而本项目 go.mod 要求 go 1.26.0、前端是 Node 22。
#   这里直接用官方镜像，版本和 Dockerfile 保持一致。
#
# 镜像走 DaoCloud 的 Docker Hub 镜像站：Gitee Go 构建机直连 Docker Hub
# 会 Back-off pulling image，换成国内镜像站即可。
#
# 前置条件（Gitee Go → 流水线 → 通用变量）：
#   MIRROR_TOKEN = Gitee 私人令牌（projects 权限），用于克隆两个私有子模块镜像：
#     gitee.com/yr007/danmu-ku-web-server
#     gitee.com/yr007/danmu-ku-web-web
#   子模块源码在 GitHub，但 Gitee 构建机访问 github.com 不稳定，
#   所以 CI 从 Gitee 镜像拉取（镜像由 scripts/push-to-github.sh 同步）。
#   未配置 MIRROR_TOKEN 时脚本会直接报错退出。
#   AI_API_KEY = OpenCode Go（或其它 OpenAI 兼容服务）的 API Key，
#                用于 AI 代码审查；未配置时跳过审查，不阻塞构建。
#   ISSUE_TOKEN = 有 issues 权限的 Gitee 私人令牌，用于创建审查 Issue。
#   AI_BASE_URL / AI_MODEL 可选，默认 OpenCode Go + deepseek-v4.1-flash。
version: "1.0"
name: ci
displayName: CI（测试 + 构建）

triggers:
  trigger: auto
  # 所有分支推送都触发（正则 .* 匹配所有分支）
  push:
    branches:
      include:
        - ".*"
  pr:
    branches:
      include:
        - main

stages:
  # 放在最前面：即使后端/前端构建失败，也保证每次推送都有 AI 审查记录。
  # 审查失败不阻塞构建（脚本内部吞掉错误，始终 exit 0）。
  - name: ai_review
    displayName: AI 代码审查
    strategy: naturally
    trigger: auto
    steps:
      - step: execute@docker
        name: ai_review
        displayName: 审查提交并创建 Issue
        certificate: ''
        image: docker.m.daocloud.io/library/alpine:3.24
        command:
          - set -eu
          - sed -i 's#dl-cdn.alpinelinux.org#mirrors.tuna.tsinghua.edu.cn#g' /etc/apk/repositories
          - apk add --no-cache bash git curl jq
          - bash scripts/ai-review.sh

  - name: backend
    displayName: 后端
    strategy: naturally
    trigger: auto
    steps:
      - step: execute@docker
        name: backend_ci
        displayName: Go 构建 / vet / 测试
        certificate: ''
        image: docker.m.daocloud.io/library/golang:1.26-alpine
        command:
          - set -eu
          - sed -i 's#dl-cdn.alpinelinux.org#mirrors.tuna.tsinghua.edu.cn#g' /etc/apk/repositories
          - apk add --no-cache git openssh-client
          - |
            if [ ! -f DanmuKuWeb-Server/go.mod ]; then
              echo ">> 子模块未检出，开始初始化"
              if [ -z "${MIRROR_TOKEN:-}" ]; then
                echo "ERROR: 未配置 MIRROR_TOKEN，无法拉取 Gitee 私有子模块镜像。" >&2
                echo "请在 Gitee Go → 流水线 → 通用变量中添加 MIRROR_TOKEN（projects 权限的 Gitee 私人令牌）。" >&2
                exit 1
              fi
              git config --global url."https://yr007:${MIRROR_TOKEN}@gitee.com/yr007/danmu-ku-web-server.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Server.git"
              git config --global url."https://yr007:${MIRROR_TOKEN}@gitee.com/yr007/danmu-ku-web-web.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Web.git"
              git submodule update --init --recursive
            fi
          - cd DanmuKuWeb-Server
          - export GOFLAGS=-mod=mod
          - export CGO_ENABLED=0
          - export GOPROXY=https://goproxy.cn,direct
          - go mod download
          - go build ./...
          - go vet ./...
          - go test -v -coverprofile=cover.out ./...

  - name: frontend
    displayName: 前端
    strategy: naturally
    trigger: auto
    steps:
      - step: execute@docker
        name: frontend_ci
        displayName: 依赖安装 / 类型检查 / 构建
        certificate: ''
        image: docker.m.daocloud.io/library/node:22-alpine
        command:
          - set -eu
          - sed -i 's#dl-cdn.alpinelinux.org#mirrors.tuna.tsinghua.edu.cn#g' /etc/apk/repositories
          - apk add --no-cache git openssh-client
          - |
            if [ ! -f DanmuKuWeb-Web/package.json ]; then
              echo ">> 子模块未检出，开始初始化"
              if [ -z "${MIRROR_TOKEN:-}" ]; then
                echo "ERROR: 未配置 MIRROR_TOKEN，无法拉取 Gitee 私有子模块镜像。" >&2
                echo "请在 Gitee Go → 流水线 → 通用变量中添加 MIRROR_TOKEN（projects 权限的 Gitee 私人令牌）。" >&2
                exit 1
              fi
              git config --global url."https://yr007:${MIRROR_TOKEN}@gitee.com/yr007/danmu-ku-web-server.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Server.git"
              git config --global url."https://yr007:${MIRROR_TOKEN}@gitee.com/yr007/danmu-ku-web-web.git".insteadOf "git@github.com:hgu-yr/DanmuKuWeb-Web.git"
              git submodule update --init --recursive
            fi
          - cd DanmuKuWeb-Web
          - npm ci --no-audit --no-fund
          - npm run type-check
          - npm run build

# 关联 Gitee Go「通用变量」，构建时注入为同名环境变量。
# 变量值保存在「流水线 → 通用变量」中，不写进仓库。
#   MIRROR_TOKEN  检出 Gitee 子模块镜像
#   AI_API_KEY    DeepSeek / OpenAI 兼容接口的 Key
#   ISSUE_TOKEN   有 issues 权限的 Gitee 私人令牌（创建审查 Issue）
ref_variable:
  - MIRROR_TOKEN
  - AI_API_KEY
  - ISSUE_TOKEN
