# 本地/单机生产部署：web 容器托管前端并反代 API/WS，server 只在内网。
# 使用前：cp .env.example .env 并填写 ADMIN_PASSWORD / ALLOWED_ORIGINS。
name: danmuku

services:
  server:
    build:
      context: ./DanmuKuWeb-Server
    image: ${SERVER_IMAGE:-danmuku-server:local}
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DB_PATH: /app/data/danmuku.db
      FILTER_CONFIG_PATH: /app/config/filter_rules.json
      # 生产必须改成实际访问域名，例如 https://danmuku.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # web 容器所在 Docker 子网，让后端信任 Nginx 传来的真实 IP
      TRUSTED_PROXIES: 172.28.0.0/16
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CLIENT_TOKEN_SECRET: ${CLIENT_TOKEN_SECRET:-}
      WS_MAX_CLIENTS: ${WS_MAX_CLIENTS:-5000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
      # 弹幕与点赞数存 Redis（TTL 默认 24h）
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      REDIS_KEY_PREFIX: danmaku
    volumes:
      - danmuku-data:/app/data
      # 需要地区统计时，把 ip2region.xdb 放到 ./data 并取消下面这行
      # - ./data/ip2region.xdb:/app/data/ip2region.xdb:ro
    expose:
      - "8080"
    networks:
      - danmuku
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 弹幕是短生命周期数据，用 AOF 保证容器重启后 24h 内的弹幕不丢；
    # 设置 REDIS_PASSWORD 时写入临时配置文件（避免密码出现在进程参数里）
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          case "$$REDIS_PASSWORD" in
            *[!A-Za-z0-9._~!@%^+=-]*)
              echo "[error] REDIS_PASSWORD contains unsupported characters (use A-Za-z0-9._~!@%^+=-)" >&2
              exit 1
              ;;
          esac
          rm -f /tmp/redis-auth.conf
          umask 077
          printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
          chmod 600 /tmp/redis-auth.conf
          exec redis-server --appendonly yes --include /tmp/redis-auth.conf
        fi
        echo "[warn] REDIS_PASSWORD is empty, starting Redis without authentication" >&2
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - danmuku
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./DanmuKuWeb-Web
    image: ${WEB_IMAGE:-danmuku-web:local}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - danmuku
    restart: unless-stopped

volumes:
  danmuku-data:
  redis-data:

networks:
  danmuku:
    ipam:
      config:
        - subnet: 172.28.0.0/16
