# 本地/单机生产部署：web 容器托管前端并反代 API/WS，server 只在内网。
# 使用前：cp .env.example .env 并填写 ADMIN_PASSWORD / ALLOWED_ORIGINS。
name: danmuku

services:
  server:
    build:
      context: ./DanmuKuWeb-Server
    image: ${SERVER_IMAGE:-danmuku-server:local}
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DB_PATH: /app/data/danmuku.db
      FILTER_CONFIG_PATH: /app/config/filter_rules.json
      # 生产必须改成实际访问域名，例如 https://danmuku.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # web 容器所在 Docker 子网，让后端信任 Nginx 传来的真实 IP
      TRUSTED_PROXIES: 172.28.0.0/16
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CLIENT_TOKEN_SECRET: ${CLIENT_TOKEN_SECRET:-}
      WS_MAX_CLIENTS: ${WS_MAX_CLIENTS:-5000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
    volumes:
      - danmuku-data:/app/data
      # 需要地区统计时，把 ip2region.xdb 放到 ./data 并取消下面这行
      # - ./data/ip2region.xdb:/app/data/ip2region.xdb:ro
    expose:
      - "8080"
    networks:
      - danmuku
    restart: unless-stopped

  web:
    build:
      context: ./DanmuKuWeb-Web
    image: ${WEB_IMAGE:-danmuku-web:local}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - danmuku
    restart: unless-stopped

volumes:
  danmuku-data:

networks:
  danmuku:
    ipam:
      config:
        - subnet: 172.28.0.0/16
